advertisement:
  heartbeat_ttl_seconds: 30
  remove_unhealthy_after_seconds: 90
  generic_fallback_tags:
    - text
    - local

nodes:
  spark-cluster:
    role: heavy-multimodal
    endpoint: http://spark-cluster.local:8888/v1
    health:
      url: http://spark-cluster.local:8888/health
      timeout_seconds: 2
    tags:
      - vision
      - long_context
      - large_model

  rtx-5090:
    role: workhorse
    endpoint: http://ai-workstation.local:8080/v1
    health:
      url: http://ai-workstation.local:8080/health
      timeout_seconds: 2
    tags:
      - fast_tool_calls
      - home_assistant
      - coding
      - embeddings

models:
  deepseek-vision:
    node: spark-cluster
    endpoint: http://spark-cluster.local:8888/v1
    model: deepseek-v4-flash-vision-exp
    capabilities:
      text: true
      vision: true
      tool_calling: true
      max_context: 1048576
    tags:
      - vision
      - long_context
      - local

  qwen-workhorse:
    node: rtx-5090
    endpoint: http://ai-workstation.local:8080/v1
    model: qwen3.8-27b
    capabilities:
      text: true
      vision: false
      tool_calling: true
      max_context: 131072
    tags:
      - home_assistant
      - coding
      - fast
      - local

routes:
  - name: vision
    when:
      has_image: true
    prefer:
      - deepseek-vision

  - name: home_assistant
    when:
      tools_include:
        - HassGetState
        - HassTurnOn
        - HassTurnOff
    prefer:
      - qwen-workhorse
    fallback:
      - deepseek-vision

  - name: long_context
    when:
      input_tokens_gt: 50000
    prefer:
      - deepseek-vision

  - name: default
    prefer:
      - qwen-workhorse
